<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e1b4b;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#grad)" rx="12"/>

  <!-- Graph grid -->
  <g transform="translate(80, 80)">
    <rect x="0" y="0" width="440" height="180" fill="rgba(255,255,255,0.03)" rx="8"/>

    <!-- Horizontal grid lines -->
    <line x1="0" y1="45" x2="440" y2="45" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <line x1="0" y1="90" x2="440" y2="90" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <line x1="0" y1="135" x2="440" y2="135" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

    <!-- Bar chart -->
    <rect x="40" y="75" width="35" height="105" fill="#6366f1" rx="4" opacity="0.9"/>
    <rect x="90" y="45" width="35" height="135" fill="#8b5cf6" rx="4" opacity="0.9"/>
    <rect x="140" y="90" width="35" height="90" fill="#ec4899" rx="4" opacity="0.9"/>
    <rect x="190" y="30" width="35" height="150" fill="#10b981" rx="4" opacity="0.9"/>
    <rect x="240" y="105" width="35" height="75" fill="#f59e0b" rx="4" opacity="0.9"/>
    <rect x="290" y="60" width="35" height="120" fill="#06b6d4" rx="4" opacity="0.9"/>
    <rect x="340" y="120" width="35" height="60" fill="#ef4444" rx="4" opacity="0.9"/>

    <!-- Trend line -->
    <polyline points="57,120 107,75 157,105 207,60 257,130 307,90 357,135"
              fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Dots on trend line -->
    <circle cx="57" cy="120" r="4" fill="#fbbf24"/>
    <circle cx="107" cy="75" r="4" fill="#fbbf24"/>
    <circle cx="157" cy="105" r="4" fill="#fbbf24"/>
    <circle cx="207" cy="60" r="4" fill="#fbbf24"/>
    <circle cx="257" cy="130" r="4" fill="#fbbf24"/>
    <circle cx="307" cy="90" r="4" fill="#fbbf24"/>
    <circle cx="357" cy="135" r="4" fill="#fbbf24"/>

    <!-- Axes -->
    <line x1="0" y1="180" x2="440" y2="180" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
    <line x1="0" y1="0" x2="0" y2="180" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
  </g>

  <text x="300" y="310" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="28" font-weight="bold">HR Analytics</text>
  <text x="300" y="340" text-anchor="middle" fill="#a5b4fc" font-family="Arial, sans-serif" font-size="15">Machine Learning - Prédiction du turnover</text>
</svg>
