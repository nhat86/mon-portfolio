<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e1b4b;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#grad)" rx="12"/>

  <!-- Camera body -->
  <g transform="translate(200, 120)">
    <rect x="0" y="40" width="200" height="120" rx="16" fill="#334155" stroke="#475569" stroke-width="2"/>
    <rect x="20" y="20" width="40" height="20" rx="4" fill="#475569"/>
    <circle cx="160" cy="30" r="8" fill="#ef4444" opacity="0.8"/>

    <!-- Lens -->
    <circle cx="100" cy="100" r="45" fill="#1e293b" stroke="#64748b" stroke-width="3"/>
    <circle cx="100" cy="100" r="32" fill="#0f172a" stroke="#475569" stroke-width="2"/>
    <circle cx="100" cy="100" r="18" fill="#38bdf8" opacity="0.3"/>

    <!-- Flash -->
    <rect x="160" y="0" width="30" height="15" rx="3" fill="#fbbf24" opacity="0.9"/>
  </g>

  <!-- Decorative photo grid -->
  <g transform="translate(80, 270)">
    <rect x="0" y="0" width="60" height="40" fill="#64748b" opacity="0.3" rx="4"/>
    <rect x="70" y="0" width="60" height="40" fill="#64748b" opacity="0.3" rx="4"/>
    <rect x="140" y="0" width="60" height="40" fill="#64748b" opacity="0.3" rx="4"/>
    <rect x="210" y="0" width="60" height="40" fill="#64748b" opacity="0.3" rx="4"/>
    <rect x="280" y="0" width="60" height="40" fill="#64748b" opacity="0.3" rx="4"/>
    <rect x="350" y="0" width="60" height="40" fill="#64748b" opacity="0.3" rx="4"/>
    <rect x="420" y="0" width="60" height="40" fill="#64748b" opacity="0.3" rx="4"/>
  </g>

  <text x="300" y="340" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="28" font-weight="bold">Plateforme Photographe</text>
</svg>
