<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e1b4b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#38bdf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#bg)" rx="12" />

  <!-- Dashboard frame -->
  <rect x="60" y="70" width="480" height="260" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2" />

  <!-- Header bar -->
  <rect x="60" y="70" width="480" height="40" rx="12" fill="#334155" />
  <circle cx="85" cy="90" r="6" fill="#ef4444" />
  <circle cx="105" cy="90" r="6" fill="#fbbf24" />
  <circle cx="125" cy="90" r="6" fill="#22c55e" />

  <!-- Bar chart -->
  <rect x="100" y="210" width="30" height="70" fill="url(#barGrad)" rx="4" opacity="0.9" />
  <rect x="145" y="170" width="30" height="110" fill="url(#barGrad)" rx="4" opacity="0.9" />
  <rect x="190" y="230" width="30" height="50" fill="url(#barGrad)" rx="4" opacity="0.9" />
  <rect x="235" y="150" width="30" height="130" fill="url(#barGrad)" rx="4" opacity="0.9" />

  <!-- Line chart -->
  <polyline points="320,240 360,210 400,230 440,170 480,190 520,140" fill="none" stroke="#22d3ee" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="520" cy="140" r="5" fill="#22d3ee" />

  <!-- User / coach AI bubble -->
  <circle cx="470" cy="110" r="18" fill="#a855f7" />
  <text x="470" y="116" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="16" font-weight="bold">AI</text>
  <rect x="400" y="90" width="80" height="30" rx="8" fill="#334155" />
  <text x="440" y="110" text-anchor="middle" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="11">Coach sport</text>

  <!-- Title -->
  <text x="300" y="360" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="28" font-weight="bold">Dashboard Sport</text>
</svg>
